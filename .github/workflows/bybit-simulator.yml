name: Bybit simulator checks
on:
  pull_request:
    paths:
      - 'bybit-simulator/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/bybit-simulator.yml'
  push:
    branches: [bybit-simulator-v1]
    paths:
      - 'bybit-simulator/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/bybit-simulator.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
